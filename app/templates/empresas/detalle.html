{% extends "base.html" %}
{% block titulo %}{{ empresa.nombre }} · Publi Marketing{% endblock %}
{% block contenido %}
<h1>{{ empresa.nombre }}</h1>
<dl class="perfil-datos">
  <dt>Slug</dt>
  <dd>{{ empresa.slug }}</dd>
  <dt>Estado</dt>
  <dd>{{ "Activa" if empresa.activo else "Inactiva" }}</dd>
  <dt>Tu rol</dt>
  <dd>{{ rol.nombre }}</dd>
</dl>

<div class="cabecera-seccion">
  <a href="{{ url_for('empresas.marca', slug=empresa.slug) }}" class="boton-enlace">Identidad de marca</a>
  <a href="{{ url_for('empresas.logos', slug=empresa.slug) }}" class="boton-enlace">Biblioteca de logos</a>
</div>
{% endblock %}
